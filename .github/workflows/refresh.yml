name: Refresh F1 data

"on":
  schedule:
    # Mondays 06:00 UTC — after race weekends, when standings actually move.
    - cron: "0 6 * * 1"
  workflow_dispatch: # manual "Run workflow" button for same-day refresh after a race

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run snapshot
      - name: Commit changed snapshot
        run: |
          # generatedAt churns every run; ignore it when deciding whether data moved.
          if git diff --quiet -- . ':!src/data/snapshot.json' && \
             [ "$(git diff -U0 -- src/data/snapshot.json | grep -E '^[+-][^+-]' | grep -vc generatedAt)" -eq 0 ]; then
            echo "No data change; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: weekly F1 data refresh"
          git push
